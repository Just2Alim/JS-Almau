<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 8.2 - Event Delegation</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        #perf-results {
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
        }

        #todo-list {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }

        .todo-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: gray;
        }

        /* Стили для приоритетов */
        .priority-high {
            border-left: 4px solid red;
        }

        .priority-normal {
            border-left: 4px solid blue;
        }

        .priority-low {
            border-left: 4px solid green;
        }

        button {
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 3px;
        }

        button:hover {
            background: #eee;
        }

        .error-text {
            color: red;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <h2>Todo List (1000+ Items)</h2>

    <div id="perf-results">
        Загрузка скриптов... <br>
        <span class="error-text">(Если этот текст не исчезает, обязательно открой страницу через плагин Live Server в VS
            Code)</span>
    </div>

    <div id="todo-list"></div>

    <script type="module" src="./main.js"></script>
</body>

</html>
